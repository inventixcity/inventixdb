# ============================================================================
# InventixDB Configuration File
# ============================================================================
# 
# This file contains all configurable settings for InventixDB.
# Lines starting with # or ; are comments.
# Values can be quoted with " or ' (optional for strings without spaces).
#
# To apply changes, restart the server or use the RELOAD CONFIG command.
#
# ============================================================================

# ----------------------------------------------------------------------------
# STORAGE ENGINE CONFIGURATION
# ----------------------------------------------------------------------------
[storage]

# Initial hash table capacity (power of 2 recommended)
# Higher values use more memory but reduce rehashing
initial_capacity = 1024

# Checkpoint threshold in KB (auto-snapshot when AOF exceeds this)
# Default: 2048 (2MB)
checkpoint_threshold_kb = 2048

# Append-Only File for durability (Write-Ahead Log)
log_file = "inventix.log"

# Snapshot file for faster recovery
snap_file = "inventix.snap"

# Data directory for all database files
data_dir = "./data"

# Maximum level for Skip List indexes (affects memory vs speed tradeoff)
# Range: 4-16, Default: 6
skip_list_max_level = 6

# Enable Append-Only File logging (recommended for durability)
enable_aof = true

# Enable periodic snapshots
enable_snapshots = true

# Sync to disk after every write (slower but safer)
# Set to true for maximum durability, false for better performance
sync_on_write = false


# ----------------------------------------------------------------------------
# BUFFER POOL CONFIGURATION
# ----------------------------------------------------------------------------
[buffer_pool]

# Number of pages to keep in memory (RAM cache)
# Higher values = better performance, more memory usage
# Recommended: Available RAM / page_size / 4
pool_size = 10

# Page size in bytes (must match B+ tree node size)
# Standard values: 4096, 8192, 16384
page_size = 4096

# Enable page prefetching for sequential scans
prefetch_enabled = false

# Page eviction policy: LRU, CLOCK, or LFU
eviction_policy = LRU


# ----------------------------------------------------------------------------
# NETWORK CONFIGURATION
# ----------------------------------------------------------------------------
[network]

# Server listening port
# Default: 8888, Workers typically use 8889, 8890, etc.
server_port = 8888

# Maximum concurrent client connections
max_connections = 100

# Connection timeout in milliseconds
connection_timeout_ms = 30000

# Read buffer size per connection (bytes)
read_buffer_size = 4096

# Write buffer size per connection (bytes)
write_buffer_size = 4096

# Enable TCP_NODELAY (disable Nagle's algorithm)
# Recommended: true for low-latency queries
enable_tcp_nodelay = true

# Listen backlog queue size
backlog_size = 128


# ----------------------------------------------------------------------------
# DISTRIBUTED SYSTEM CONFIGURATION
# ----------------------------------------------------------------------------
[distributed]

# Is this node the master/coordinator?
# Set to true on the main node, false on workers
is_master = false

# Number of worker nodes in the cluster
worker_count = 2

# Replication factor (number of copies of each data item)
# 1 = no replication, 2+ = data is replicated for fault tolerance
replication_factor = 1

# Partition strategy: HASH or RANGE
# HASH: Consistent hashing based on primary key
# RANGE: Range-based partitioning (requires partition keys)
partition_strategy = HASH

# Heartbeat interval for health checks (milliseconds)
heartbeat_interval_ms = 5000

# Worker timeout before marking as failed (milliseconds)
worker_timeout_ms = 10000

# Enable automatic failover when a worker fails
enable_auto_failover = false


# ----------------------------------------------------------------------------
# WORKER NODE DEFINITIONS
# ----------------------------------------------------------------------------
# Define each worker with [worker.N] sections where N is 0-indexed

[worker.0]
ip = "127.0.0.1"
port = 8889
enabled = true
name = "worker-1"

[worker.1]
ip = "127.0.0.1"
port = 8890
enabled = true
name = "worker-2"

# Add more workers as needed:
# [worker.2]
# ip = "192.168.1.103"
# port = 8891
# enabled = true
# name = "worker-3"


# ----------------------------------------------------------------------------
# CLUSTER CONFIGURATION
# ----------------------------------------------------------------------------
# New in InventixDB 2.0: Full distributed system configuration
# with Raft consensus, automatic failover, and data replication.
# Enable this section to run InventixDB in cluster mode.
# ----------------------------------------------------------------------------
[cluster]

# Enable cluster mode (set to true for multi-node deployment)
enabled = false

# Unique name for this node (must be unique across cluster)
node_name = "node-1"

# Node ID (leave empty for auto-generation)
node_id = ""

# Cluster name (all nodes must use the same cluster name)
cluster_name = "inventix-cluster"

# Host address to bind to (0.0.0.0 for all interfaces)
bind_host = "0.0.0.0"

# Port to bind to (cluster communication port)
bind_port = 9876

# Host address to advertise to other nodes
# Use actual IP if running on different machines
advertise_host = "127.0.0.1"

# Port to advertise to other nodes
advertise_port = 9876

# Raft election timeout range (milliseconds)
# Randomized within this range to prevent split votes
election_timeout_min_ms = 3000
election_timeout_max_ms = 5000

# Maximum Raft log entries before compaction
raft_log_max_entries = 10000

# Number of replicas per partition (including primary)
# Higher values = better fault tolerance, more disk usage
replication_factor = 2

# Replication mode:
# ASYNC    - Fire and forget (fastest, risk of data loss)
# SYNC     - Wait for min_sync_replicas acknowledgments
# SYNC_ALL - Wait for all replicas (slowest, safest)
replication_mode = ASYNC

# Minimum replicas that must acknowledge writes in SYNC mode
min_sync_replicas = 1

# Number of data partitions (should be power of 2)
# More partitions = better load balancing, more overhead
partition_count = 16

# Partition strategy: HASH or RANGE
# HASH  - Consistent hashing (even distribution)
# RANGE - Range-based (good for range queries)
partition_strategy = HASH

# Enable automatic partition rebalancing
auto_rebalance = true

# Rebalance threshold (percentage imbalance that triggers rebalance)
rebalance_threshold_pct = 20

# Heartbeat interval for cluster communication (milliseconds)
heartbeat_interval_ms = 1000

# Node timeout before marking as dead (milliseconds)
node_timeout_ms = 5000

# Health check interval (milliseconds)
health_check_interval_ms = 2000

# Maximum concurrent client connections
max_clients = 1000

# Client idle timeout (seconds)
client_timeout_sec = 300


# ----------------------------------------------------------------------------
# CLUSTER SEED NODES
# ----------------------------------------------------------------------------
# Seed nodes for cluster discovery. New nodes contact these to join cluster.
# Format: [seed.N] where N is 0-indexed

# [seed.0]
# address = "192.168.1.100:9876"

# [seed.1]
# address = "192.168.1.101:9876"

# [seed.2]
# address = "192.168.1.102:9876"


# ----------------------------------------------------------------------------
# SECURITY CONFIGURATION
# ----------------------------------------------------------------------------
[security]

# Enable authentication (recommended)
enable_auth = true

# Default admin username (created on first startup)
default_admin_user = "admin"

# Default admin password (CHANGE THIS!)
# Will be hashed at runtime
default_admin_pass = "admin"

# Minimum password length for new users
password_min_length = 6

# Session timeout in seconds (1 hour default)
session_timeout_sec = 3600

# Maximum failed login attempts before lockout
max_login_attempts = 5

# Lockout duration in seconds after max failed attempts
lockout_duration_sec = 300


# ----------------------------------------------------------------------------
# LOGGING CONFIGURATION
# ----------------------------------------------------------------------------
[logging]

# Log level: DEBUG, INFO, WARN, ERROR
# DEBUG shows everything, ERROR shows only errors
log_level = INFO

# Server log file path
log_file = "inventix_server.log"

# Maximum log file size in MB before rotation
max_log_size_mb = 100

# Number of rotated log files to keep
log_rotation_count = 5

# Log all executed queries (verbose, for debugging)
enable_query_logging = false

# Log queries that exceed threshold (performance monitoring)
enable_slow_query_log = true

# Slow query threshold in milliseconds
slow_query_threshold_ms = 1000


# ----------------------------------------------------------------------------
# QUERY EXECUTION CONFIGURATION
# ----------------------------------------------------------------------------
[query]

# Maximum rows to return in a single query result
# Prevents runaway queries from consuming too much memory
max_result_rows = 10000

# Query timeout in seconds (0 = no timeout)
query_timeout_sec = 60

# Enable query result caching
enable_query_cache = false

# Query cache size in MB
query_cache_size_mb = 64

# Maximum memory per query in MB
max_memory_per_query_mb = 128


# ============================================================================
# END OF CONFIGURATION
# ============================================================================


# ----------------------------------------------------------------------------
# ADVANCED STORAGE ENGINE CONFIGURATION
# ----------------------------------------------------------------------------
# New in InventixDB 2.0: Choose between different storage backends
# for optimal performance based on your workload characteristics
# ----------------------------------------------------------------------------
[storage_engine]

# Storage engine type:
# ROW_STORE   - Traditional row-oriented storage (default)
#               Best for: OLTP workloads, point queries, mixed reads/writes
# COLUMN_STORE - Columnar storage for analytics
#               Best for: OLAP workloads, aggregations, analytics queries
# LSM_TREE    - Log-Structured Merge Tree
#               Best for: Write-heavy workloads, time-series data
engine_type = ROW_STORE

# Compression type:
# NONE - No compression (fastest, uses most disk space)
# LZ4  - Fast compression (good balance of speed and ratio)
# RLE  - Run-Length Encoding (best for columnar data with repeating values)
compression_type = NONE

# Enable slotted pages for variable-length records
# Allows efficient storage of VARCHAR and TEXT fields
enable_slotted_pages = true

# LSM Tree Settings (only used when engine_type = LSM_TREE)
# MemTable size in KB before flushing to SSTable
lsm_memtable_size_kb = 4096

# Number of LSM levels (more levels = better read performance, slower writes)
lsm_level_count = 7

# Number of SSTables per level before triggering compaction
lsm_compaction_threshold = 4

# Columnar Storage Settings (only used when engine_type = COLUMN_STORE)
# Number of rows per column chunk
column_chunk_size = 1024

# Enable Bloom filters for LSM Tree (reduces disk reads for missing keys)
enable_bloom_filter = true

# Minimum data size in bytes before compression is applied
compression_threshold = 512

# Enable automatic background compaction
auto_compact = true
